# Проверки на каждый pull request и на ветки fix/* и feat/*: типы, тесты, сборка (аудит 9, C1).
# На main публикацию делает pages.yml; здесь — только проверка, ничего не публикуется.
name: CI

on:
  pull_request:
  push:
    branches: ['fix/**', 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json в репозитории нет: после `npm install --package-lock-only` и коммита файла заменить на `npm ci`
      - run: npm install
      # типы тестов пока не чистые (Money и number в tests/sanity, tests/support) — проверяем engine и app
      - run: npx tsc --noEmit -p tsconfig.local.json
      - run: npm test
      - run: npm run build
